[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:uvicorn]
command=uvicorn main:app --host 0.0.0.0 --port 8000 --reload
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; NOTE: gitnexus eval-server chạy trong container outline-gitnexus (port 4848),
; không cần start ở đây. Backend gọi qua GITNEXUS_EVAL_SERVER_URL.
; Trước đây start ở /data/repos (không tồn tại trong container này) → exit 127.
